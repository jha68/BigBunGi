name: Test and deploy BigBunGi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -m bigbungi.prepare
      - run: python -m bigbungi.model_access
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        # The repository owner enabled Pages. Do not attempt an admin-only create.
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check domain configuration
        id: domain
        uses: actions/github-script@v7
        with:
          script: |
            const { data: site } = await github.request('GET /repos/{owner}/{repo}/pages', context.repo);
            const connected = site.cname === 'bigbungi.junununseo.com';
            core.setOutput('connected', connected ? 'true' : 'false');
            core.setOutput('url', site.html_url);
            if (connected) {
              core.notice('Custom domain configured: ' + site.cname + '; HTTPS enforcement: ' + site.https_enforced);
            } else {
              core.warning('Application published. Repository owner must save bigbungi.junununseo.com in Settings > Pages > Custom domain.');
            }
      - name: Verify the public HTTPS application
        uses: actions/github-script@v7
        with:
          script: |
            const customDomain = '${{ steps.domain.outputs.connected }}' === 'true';
            const origin = customDomain ? 'https://bigbungi.junununseo.com/' : '${{ steps.domain.outputs.url }}';
            const endpoint = path => new URL(path, origin).href;
            let failure;
            for (let attempt = 0; attempt < 20; attempt++) {
              try {
                const options = () => ({ signal: AbortSignal.timeout(12000) });
                const page = await fetch(origin, options());
                if (!page.ok) throw new Error('App HTTP status: ' + page.status);
                const html = await page.text();
                if (!html.includes('빅분기')) throw new Error('Unexpected app HTML');
                const response = await fetch(endpoint('content/catalog.json'), options());
                if (!response.ok) throw new Error('Catalog HTTP status: ' + response.status);
                const catalog = await response.json();
                const counts = [1, 2, 3].map(type => catalog.filter(p => p.type === type).length);
                if (counts.join(',') !== '10,3,3') throw new Error('Unexpected exercise counts: ' + counts);
                const assets = [...html.matchAll(/(?:src|href)="([^"]+\.(?:js|css))"/g)].map(match => match[1]);
                if (!assets.length) throw new Error('Built assets missing from HTML');
                for (const path of [...assets, 'python-worker.js', 'content/problems/t1-01.json']) {
                  const asset = await fetch(endpoint(path), options());
                  if (!asset.ok) throw new Error('Missing application asset: ' + path);
                }
                core.notice('LIVE VERIFIED: HTTPS 200, application assets, Python worker, and 16 exercises (10/3/3) at ' + origin);
                await core.summary.addHeading('BigBunGi is live').addLink(origin, origin)
                  .addRaw('\n\nHTTPS, built assets, Python worker and all 16 exercise entries verified.\n').write();
                return;
              } catch (error) {
                failure = error;
                core.info('Waiting for DNS / HTTPS publication: ' + error.message);
                if (attempt < 19) await new Promise(resolve => setTimeout(resolve, 15000));
              }
            }
            throw new Error('Public HTTPS verification failed: ' + failure.message);
