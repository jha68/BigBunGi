name: Test and deploy BigBunGi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -m bigbungi.prepare
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Connect custom domain
        uses: actions/github-script@v7
        with:
          script: |
            await github.request('PUT /repos/{owner}/{repo}/pages', {
              ...context.repo,
              cname: 'bigbungi.junununseo.com'
            });
      - name: Enable HTTPS when certificate is available
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 8; attempt++) {
              try {
                await github.request('PUT /repos/{owner}/{repo}/pages', {
                  ...context.repo,
                  https_enforced: true
                });
                core.info('HTTPS enforcement enabled.');
                return;
              } catch (error) {
                if (error.status !== 422) throw error;
                core.info('GitHub Pages certificate is being provisioned.');
                await new Promise(resolve => setTimeout(resolve, 15000));
              }
            }
            core.warning('Domain connected. TLS certificate is still provisioning; enable Enforce HTTPS in Pages settings after certificate issuance.');
